name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  SITE_URL: https://zunoui.dev

jobs:
  validate:
    if: github.repository == 'zuno-ui/zuno'
    uses: ./.github/workflows/ci.yml

  deploy-web:
    name: Deploy web + registry
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: zuno
      url: ${{ env.SITE_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run build:docs
      - name: Install deploy SSH credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.VPS_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/zuno-web-deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/zuno-web-deploy ~/.ssh/known_hosts
      - name: Upload static release and switch current
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          APP: /srv/apps/zuno-web
          RELEASE: /srv/apps/zuno-web/releases/${{ github.sha }}
        run: |
          SSH="ssh -i $HOME/.ssh/zuno-web-deploy -o IdentitiesOnly=yes"
          $SSH "deploy@$VPS_HOST" "mkdir -p '$RELEASE'"
          rsync -az --delete -e "$SSH" apps/docs/out/ "deploy@$VPS_HOST:$RELEASE/"
          $SSH "deploy@$VPS_HOST" "ln -sfn '$RELEASE' '$APP/current.next' && mv -Tf '$APP/current.next' '$APP/current' && ls -1dt '$APP'/releases/* | tail -n +6 | xargs -r rm -rf"
      - name: Smoke test the public registry
        run: curl -fsS "$SITE_URL/r/button.json" | node -e 'const i=JSON.parse(require("fs").readFileSync(0));if(i.name!=="button"||!i.files?.[0]?.content)process.exit(1)'

  version:
    name: Version PR
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pending: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Create a scoped GitHub App token when configured
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: zuno
          permission-contents: write
          permission-pull-requests: write
      - name: Create or update the version PR (never publishes)
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          version: bun run ci:version
          title: 'chore: release zunoui'
          commit: 'chore: release zunoui'
          commitMode: github-api
          createGithubReleases: false

  publish-npm:
    name: Publish zunoui
    needs: [deploy-web, version]
    if: needs.version.outputs.pending == 'false' && vars.ENABLE_NPM_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - name: Publish with npm Trusted Publishing (OIDC)
        id: publish
        working-directory: packages/cli
        run: |
          version=$(node -p 'require("./package.json").version')
          if npm view "zunoui@$version" version >/dev/null 2>&1; then
            echo "zunoui@$version is already on npm." >> "$GITHUB_STEP_SUMMARY"
          else
            # During the alpha every version goes to latest; npm requires an explicit tag for prereleases.
            # A re-run can start before npm shows a version it has just accepted: treat that conflict as published.
            set -o pipefail
            log="$RUNNER_TEMP/npm-publish.log"
            if npm publish --access public --tag latest 2>&1 | tee "$log"; then
              echo "Published zunoui@$version with dist-tag latest." >> "$GITHUB_STEP_SUMMARY"
            elif grep -q "previously published" "$log"; then
              echo "zunoui@$version was already published; npm had not shown it yet." >> "$GITHUB_STEP_SUMMARY"
            else
              exit 1
            fi
          fi
          # npm can take a while to serve a new version. Wait for it so the summary reflects what users get.
          for attempt in $(seq 1 18); do
            if npm view "zunoui@$version" version >/dev/null 2>&1; then
              echo "zunoui@$version is available on npm." >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            if [ "$attempt" = 18 ]; then
              echo "::warning::zunoui@$version was accepted but npm is not serving it yet after 3 minutes."
              break
            fi
            sleep 10
          done
          # The tag marks the commit that released this version. Later pushes without a changeset keep the
          # same version, so an existing tag is left where it is; it is only created when still missing.
          tag="zunoui@$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists." >> "$GITHUB_STEP_SUMMARY"
          else
            git tag "$tag"
            git push origin "$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release from changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.publish.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version="${{ steps.publish.outputs.version }}"
          notes="$RUNNER_TEMP/zunoui-release-notes.md"
          awk -v version="$version" '
            $0 == "## " version { in_version=1; next }
            in_version && /^## / { exit }
            in_version { print }
          ' packages/cli/CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            echo "::error::No changelog notes for $version"
            exit 1
          fi
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$tag" --verify-tag --title "$tag" --notes-file "$notes" "${flags[@]}"
          echo "Created GitHub Release $tag." >> "$GITHUB_STEP_SUMMARY"
