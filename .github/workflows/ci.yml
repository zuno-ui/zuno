name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run build
      - run: bun run test
      - run: bun run build:docs
